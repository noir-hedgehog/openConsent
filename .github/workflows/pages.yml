name: Deploy official site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: node ./src/cli.mjs check ./examples/openconsent.json
      - run: node ./src/cli.mjs check ./examples/openconsent.web.json --profile web-cmp
      - name: Build public packages
        run: pnpm build:packages
      - name: Inspect public package contents
        shell: bash
        run: |
          for package_dir in packages/core packages/web packages/react packages/vue packages/express
          do
            npm pack --dry-run "./${package_dir}"
          done
      - run: pnpm smoke:tarballs
      - run: pnpm --dir apps/demo lint
      - run: pnpm --dir apps/demo exec playwright install --with-deps chromium
      - run: pnpm --dir apps/demo test:e2e
      - run: pnpm --dir apps/demo build
        env:
          VITE_BASE_PATH: /openConsent/
          # Repository Variables are public measurement identifiers, not secrets.
          # Leave them unset to keep the public demo first-party-only.
          VITE_GA_MEASUREMENT_ID: ${{ vars.OPENCONSENT_GA_MEASUREMENT_ID }}
          VITE_GOOGLE_ADS_ID: ${{ vars.OPENCONSENT_GOOGLE_ADS_ID }}
      - run: node ./scripts/check-built-site.mjs ./apps/demo/dist /openConsent/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/demo/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      actions: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
