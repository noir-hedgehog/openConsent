name: openConsent

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  compliance-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: pnpm install --frozen-lockfile
      - run: node --test
      - run: node ./src/cli.mjs check ./examples/openconsent.json
      - name: Build public packages
        run: pnpm build:packages
      - name: Inspect public package contents
        shell: bash
        run: |
          for package_dir in packages/core packages/web packages/react packages/vue packages/express
          do
            npm pack --dry-run "./${package_dir}"
          done
      - run: pnpm smoke:tarballs
      - run: mvn --batch-mode --file packages/spring-boot-starter/pom.xml test
      - run: pnpm --dir apps/demo lint
      - run: pnpm --dir apps/demo build
        env:
          VITE_BASE_PATH: /openConsent/
      - run: node ./scripts/check-built-site.mjs ./apps/demo/dist /openConsent/
