name: openConsent

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  compliance-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test
      - run: node ./src/cli.mjs check ./examples/openconsent.json
      - run: pnpm --dir apps/demo install --frozen-lockfile
      - run: pnpm --dir apps/demo build
